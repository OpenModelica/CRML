# Log4j 2 configuration of the logging backend of what Gradle runs: the tests
# of every project, and run and crmlc in :compiler. See Logging in the root
# build.gradle.kts. It is not packaged: the code only uses the SLF4J API.
name = PropertiesConfig

appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Everything from the CRML compiler; from the libraries it uses, such as
# Thymeleaf, which also log through SLF4J, only info and above.
logger.crml.name = org.openmodelica.crml
logger.crml.level = trace

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT
