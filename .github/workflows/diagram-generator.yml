name: Diagram generator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagram-generator
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: build
      run: |
        npm ci
        npm run build
    - name: test
      run: npm test
    - uses: actions/upload-artifact@v4
      with:
        name: crml-diagram.min.js
        path: diagram-generator/dist/crml-diagram.min.js
