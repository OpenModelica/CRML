name: Makefile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
    
    # run omc runTest.mos using docker!
    #- name: run OM docker
    #  uses: docker://openmodelica/openmodelica:v1.19.2-minimal
    #  with: 
    #    args: omc runTests.mos

    - name: install openmodelica
      run: |
        sudo apt-get update
        sudo apt-get install ca-certificates curl gnupg lsb-release
        curl -fsSL http://build.openmodelica.org/apt/openmodelica.asc | sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
        gpg --show-keys /usr/share/keyrings/openmodelica-keyring.gpg
        # Or replace stable with nightly or release
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt \
          $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/openmodelica.list > /dev/null
        sudo apt update
        sudo apt install omc omlibrary
    
    - name: build the crml-compiler
      run: |
        sudo apt install openjdk-8-jdk
        java -version
        make distribution

    - name: run OMC tests
      run: |
        pwd
        # create a runTests.mos file to run some tests
        # this is just an example, we should create .mos 
        # files for each .mo file to run each as a JUnit test
        # load the library
        echo 'loadFile("./libraries/modelica/CRMLtoModelica.mo"); getErrorString();' >> runTests.mos
        # load a translated file
        echo 'loadFile("./build/testSuiteGenerated/spec-doc-examples/BooleanAccumulation/BooleanAccumulation.mo"); getErrorString();' >> runTests.mos
        # check the translated file
        echo 'checkModel(BooleanAccumulation); getErrorString();' >> runTests.mos
        cat runTests.mos
        omc runTests.mos

    - name: upload the crml-compiler
      uses: actions/upload-artifact@v4
      with:
        name: crml-compiler-all.jar
        path: ${{github.workspace}}/submodules/compiler/build/libs/compiler-all.jar
    
    - name: upload the tests and results
      uses: actions/upload-artifact@v4
      with:
        name: tests-and-results
        path: |
          ${{github.workspace}}/submodules/compiler/build/test_report.html
          ${{github.workspace}}/submodules/compiler/build/test-results
          ${{github.workspace}}/submodules/compiler/build/testSuiteGenerated
          ${{github.workspace}}/submodules/language/build/test-results
          ${{github.workspace}}/submodules/language/build/test_report.html
          
        if-no-files-found: warn
  
    - name: publish the test report
      uses: mikepenz/action-junit-report@v3
      if: always() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'

  web:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
          distribution: 'temurin'
          java-version: '17'
    - uses: actions/setup-node@v4
      with:
          node-version: '20'

    - name: build the crml-compiler for web browsers
      run: ./gradlew :compiler:shadowJar :web:web

    - name: compare the web build with the jar
      run: |
        MODELS=submodules/test-resources/src/main/resources/testModels
        mkdir -p build
        java -jar submodules/compiler/build/libs/compiler-all.jar -o build/web-expected \
          $(find $MODELS -name '*.crml' | LC_ALL=C sort) > build/web-expected.log 2>&1
        # the translator prints its traces to the standard output, so only the result is shown
        node submodules/web/test/compare.mjs submodules/web/build/generated/teavm/js/crml.js \
          $MODELS build/web-expected > build/web-compare.log || {
          grep "^$MODELS" build/web-compare.log; tail -1 build/web-compare.log; exit 1; }
        tail -1 build/web-compare.log
        mkdir -p build/crml-compiler-web
        cp submodules/web/build/generated/teavm/js/crml.js \
           submodules/web/build/generated/teavm/wasm-gc/crml.wasm \
           submodules/web/build/generated/teavm/wasm-gc/crml.wasm-runtime.js \
           submodules/web/README.md build/crml-compiler-web/

    - name: upload the crml-compiler for web browsers
      uses: actions/upload-artifact@v4
      with:
        name: crml-compiler-web
        path: ${{github.workspace}}/build/crml-compiler-web

